<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade Branchs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Atividade Branchs</h1>
    <nav class="menu">
  <a href="#sobre">Sobre</a>
  <a href="#galeria">Galeria</a>
  <a href="#contato">Contato</a>
</nav>
  </header>

  <main>
    <section id="sobre">
      <h2>Sobre</h2>
      <p>Projeto simples para praticar branches, commits, merges e pull requests no GitHub.</p>
    </section>

    <section id="galeria">
  <h2>Galeria</h2>
  <div class="galeria">
    <div class="foto">Foto 1</div>
    <div class="foto">Foto 2</div>
    <div class="foto">Foto 3</div>
  </div>
</section>
    <section id="contato">
  <h2>Contato</h2>
  <form class="contato">
    <input type="text" placeholder="Seu nome" required>
    <input type="email" placeholder="Seu e-mail" required>
    <textarea placeholder="Sua mensagem" rows="4"></textarea>
    <button type="submit">Enviar</button>
  </form>
</section>
  </main>

  <footer class="rodape">
  <p>&copy; 2026 Atividade Branchs. Todos os direitos reservados.</p>
</footer>
</body>
</html>
